# Auto-generated by Cimas: Do not edit it manually!
# See https://github.com/metanorma/cimas
#
# Generates through the repository bundle (Gemfile.lock pins the canonical
# stack, including the data-driven JCGM taste from metanorma-taste main)
# rather than the docker image's global gems.
name: docker

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Bundle the canonical stack
        env:
          BUNDLE_GEMFILE: "${{ github.workspace }}/Gemfile"
          BUNDLE_PATH: "${{ github.workspace }}/vendor/bundle"
          BUNDLE_FROZEN: "false"
          BUNDLE_DEPLOYMENT: "false"
        run: |
          bundle config set --local path vendor/bundle
          bundle config set frozen false
          bundle config unset deployment
          bundle install --jobs 4

      - name: Metanorma generate site
        env:
          BUNDLE_GEMFILE: "${{ github.workspace }}/Gemfile"
          BUNDLE_PATH: "${{ github.workspace }}/vendor/bundle"
        run: bundle exec metanorma site generate --config metanorma.yml -o _site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions-mn/deploy-pages@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
